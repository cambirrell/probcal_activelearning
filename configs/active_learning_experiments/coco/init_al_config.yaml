experiment_name: eva/stirn
random_seed: 1998
head_type: faithful_gaussian
dataset:
  type: image
  spec: eva
training:
  accelerator: gpu
  batch_size: 32
  chkp_dir: chkp
  chkp_freq: 50
  num_epochs: 50
  precision: bf16-mixed
  optimizer:
    type: adam_w
    kwargs:
      lr: 0.0001
      weight_decay: 0.000001
  lr_scheduler:
    type: cosine_annealing
    kwargs:
      T_max: 200
      eta_min: 0
      last_epoch: -1
evaluation:
  num_trials: 1
  log_dir: logs
active_learning:
  samples_per_iteration: 640
  initial_labeled_partition: 10
  plot_results: true
  uncertainty_metric: cce
